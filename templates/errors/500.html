{% load static %}<!DOCTYPE html>
{# Самостоятельная страница: при ошибке сервера не полагаемся на БД и базовый шаблон #}
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ошибка сервера</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
  <section class="error-page">
    <div class="container">
      <p class="error-page__code">500</p>
      <h1 class="error-page__title">Что-то пошло не так</h1>
      <p class="error-page__text">На сервере произошла ошибка. Попробуйте обновить страницу через минуту.</p>
      <div class="error-page__actions"><a class="btn btn--primary" href="/">На главную</a></div>
    </div>
  </section>
</body>
</html>
