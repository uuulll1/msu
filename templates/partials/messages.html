{% if messages %}
<div class="container messages" role="status" aria-live="polite">
  {% for message in messages %}
    <div class="alert alert--{{ message.tags|default:'info' }}">
      <span>{{ message }}</span>
      <button type="button" class="alert__close" data-dismiss aria-label="Закрыть">×</button>
    </div>
  {% endfor %}
</div>
{% endif %}
