# Пример конфигурации nginx для VPS (/etc/nginx/sites-available/msu-portal)
server {
    listen 80;
    server_name example.com www.example.com;

    # Лимит чуть выше 50 МБ, чтобы Django сам вернул понятную ошибку валидации
    client_max_body_size 55M;

    location /static/ {
        alias /srv/msu-portal/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Каталог media наружу НЕ отдаём: файлы выдаются через Django
    # (проверка модерации, счётчик скачиваний)

    location / {
        proxy_pass http://unix:/run/msu-portal/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
