# Blueprint для Render: веб-сервис + PostgreSQL + постоянный диск для файлов
databases:
  - name: msu-portal-db
    plan: basic-256mb
    databaseName: msu_portal
    user: msu_portal

services:
  - type: web
    name: msu-portal
    runtime: python
    plan: starter            # постоянный диск доступен только на платных планах
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 3 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media
      - key: DATABASE_URL
        fromDatabase:
          name: msu-portal-db
          property: connectionString
    disk:
      name: media
      mountPath: /var/data
      sizeGB: 5
