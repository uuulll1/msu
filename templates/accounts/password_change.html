{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}

{% block content %}
<div class="auth">
  <div class="auth__card">
    <h1 class="auth__title">Смена пароля</h1>
    <form method="post" class="form">
      {% csrf_token %}
      {% include "partials/form_errors.html" %}
      {% for field in form %}{% include "partials/field.html" %}{% endfor %}
      <button type="submit" class="btn btn--primary btn--block">Сменить пароль</button>
    </form>
  </div>
</div>
{% endblock %}
