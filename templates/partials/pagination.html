{% load portal_tags %}
{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Страницы">
  {% if page_obj.has_previous %}
    <a class="pagination__link" href="?{% query_transform page=page_obj.previous_page_number %}" rel="prev">← Назад</a>
  {% else %}
    <span class="pagination__link is-disabled">← Назад</span>
  {% endif %}
  <span class="pagination__info">Страница {{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
    <a class="pagination__link" href="?{% query_transform page=page_obj.next_page_number %}" rel="next">Вперёд →</a>
  {% else %}
    <span class="pagination__link is-disabled">Вперёд →</span>
  {% endif %}
</nav>
{% endif %}
